[project]
name = "data-challenge-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "polars",
    "numpy",
    "seaborn",
    "fastexcel",
    "scikit-learn",
    "pyarrow",
    "missingno",
    "ipykernel",
    "imbalanced-learn",
    "optuna",
    "scikit-optimize",
    "statsmodels",
    "altair>=5.4.0",
    "squarify",
    "xgboost>=3.2.0",
    "ipywidgets>=8.1.8",
    "plotly>=6.6.0",
    "anywidget>=0.9.21",
    "nbformat>=4.2.0",
    "prince>=0.17.0",
]

[tool.ruff]
exclude = [
    ".venv",
    "site-packages",
    ".ruff_cache",
    "docs",
    "Note"
]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

# E → erreurs de style Python
# F → erreurs logiques (imports inutilisés, etc.)
# I → organisation automatique des imports

[dependency-groups]
dev = [
    "ruff>=0.15.6",
]
